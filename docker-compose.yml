name: rigaud-tech-platform-erp

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - .env.example
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./erp-platform/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - erp-network

  frontend:
    build:
      context: .
      dockerfile: docker/flutter/Dockerfile
    working_dir: /workspace
    command: >
      sh -lc "chown -R ubuntu:ubuntu /home/ubuntu/.pub-cache &&
      su ubuntu -c 'cd /workspace &&
      /sdks/flutter/bin/flutter config --enable-web &&
      /sdks/flutter/bin/flutter pub get &&
      /sdks/flutter/bin/flutter run -d web-server --web-hostname 0.0.0.0 --web-port 3000'"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./erp-platform/frontend:/workspace
      - flutter_pub_cache:/home/ubuntu/.pub-cache
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/localhost/3000'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - erp-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rigaud_erp}
      POSTGRES_USER: ${POSTGRES_USER:-rigaud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rigaud}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rigaud} -d ${POSTGRES_DB:-rigaud_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@rigaud.tech}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://localhost/misc/ping', timeout=5)\nPY"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - erp-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  pgadmin_data:
  flutter_pub_cache:
