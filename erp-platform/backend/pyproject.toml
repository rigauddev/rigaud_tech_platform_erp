[project]
name = "rigaud-tech-platform-erp-backend"
version = "0.1.0"
description = "Backend da Rigaud Tech Platform ERP."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt<5",
    "fastapi>=0.115.0",
    "bcrypt>=4.0,<5.0",
    "cryptography>=42.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyotp>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "python-json-logger>=2.0.7",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: tests that do not require external services",
    "integration: tests that require external services such as PostgreSQL",
]
